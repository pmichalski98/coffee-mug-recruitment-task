version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: inventory-mongodb-dev
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: inventory-management
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - inventory-network-dev
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/inventory-management --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: inventory-api-dev
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/inventory-management
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - inventory-network-dev
    restart: unless-stopped
    command: npm run dev

volumes:
  mongodb_data_dev:

networks:
  inventory-network-dev:
    driver: bridge

